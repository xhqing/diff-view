# CI —— 检查与回归防护（每次 PR、每次 main push 都跑）
# 检查项：
#   1. TypeScript 语法（与 pi 加载器同口径：Node 类型擦除）
#   2. shell 脚本语法（install.sh）
#   3. 版本号一致性（VERSION 是唯一权威：VERSION ↔ CHANGELOG ↔ 中英 README 徽章）
#   4. 结构冒烟（唯一实现文件存在、install.sh 可执行、扩展注册了预期命令）

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: TypeScript syntax (same parser as pi's loader)
        run: node --experimental-strip-types --check diff-view.ts

      - name: Shell script syntax
        run: bash -n install.sh

      - name: Version consistency (VERSION is the single source of truth)
        run: |
          V="$(tr -d '[:space:]' < VERSION)"
          CL="$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          BD_EN="$(grep -m1 -oE 'Version-[0-9]+\.[0-9]+\.[0-9]+' README.md | cut -d- -f2)"
          BD_CN="$(grep -m1 -oE 'Version-[0-9]+\.[0-9]+\.[0-9]+' README_cn.md | cut -d- -f2)"
          echo "VERSION=$V changelog=$CL readme.en=$BD_EN readme.cn=$BD_CN"
          [ "$V" = "$CL" ] && [ "$V" = "$BD_EN" ] && [ "$V" = "$BD_CN" ] || { echo "版本号不一致"; exit 1; }

      - name: Structure smoke test
        run: |
          test -f diff-view.ts
          test -x install.sh
          grep -q 'registerCommand("open-diff"' diff-view.ts
          grep -q 'registerCommand("close-diff"' diff-view.ts
          grep -q 'name: "open_diff"' diff-view.ts
          grep -q 'name: "close_diff"' diff-view.ts
