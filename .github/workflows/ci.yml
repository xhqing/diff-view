# CI —— 检查与回归防护（每次 PR、每次 main push 都跑）
# 检查项：
#   1. JS 语法检查（diff-view-vsce 全部 .js）
#   2. shell 脚本语法（install.sh / build.sh）
#   3. 版本号一致性（VERSION 是唯一权威：VERSION ↔ package.json / CHANGELOG / README 徽章）
#   4. 产物构建冒烟（build.sh 产出唯一产物 zip：内含 vsix + pi 扩展文件，共用同一版本号）

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: JS syntax check (diff-view-vsce)
        run: find diff-view-vsce -name '*.js' -not -path '*/node_modules/*' -exec node --check {} +

      - name: Shell scripts syntax
        run: bash -n install.sh && bash -n build.sh

      - name: Version consistency (VERSION is the single source of truth)
        run: |
          V="$(tr -d '[:space:]' < VERSION)"
          PKG="$(node -p "require('./diff-view-vsce/package.json').version")"
          CL="$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          BD="$(grep -m1 -oE 'Version-[0-9]+\.[0-9]+\.[0-9]+' README.md | cut -d- -f2)"
          echo "VERSION=$V package.json=$PKG changelog=$CL readme-badge=$BD"
          [ "$V" = "$PKG" ] && [ "$V" = "$CL" ] && [ "$V" = "$BD" ] || { echo "版本号不一致"; exit 1; }

      - name: Build artifact smoke test (one zip: vsix + pi extension, same version)
        run: |
          command -v zip >/dev/null || sudo apt-get install -y zip
          ./build.sh
          V="$(tr -d '[:space:]' < VERSION)"
          ls -lh dist/
          test -f "dist/diff-view-$V.zip"
          unzip -l "dist/diff-view-$V.zip" | grep -q "diff-view-vsce-$V.vsix"
          unzip -l "dist/diff-view-$V.zip" | grep -q "diff-view.ts"
